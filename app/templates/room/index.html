{% extends "index.html" %}

{% block main %}

<style>
    .container {
        width: 90%;
        height: 90%;
        margin: auto;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .users-card {
        box-shadow: 0 !important;
        flex: .3 !important;
    }

    .users-list > li {
        width: 100%;
    }

    /* From Uiverse.io by ahmed150up */
    .card {
        /* width: 100%; */
        flex: 1;
        height: 90%;
        background-color: #fff;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1) !important;
    }

    .chat-header-box {
        display: flex;
        flex-direction: column;
        background-color: #333;
        line-height: 28px;
        position: relative;
        padding-block: 5px;
    }

    .chat-header {
        background-color: #333;
        color: #fff;
        padding: 10px;
        font-size: 18px;
        border-top-left-radius: 5px;
        border-top-right-radius: 5px;
    }

    .search-input-box {
        position: relative;
    }

    .search-input {
        width: 90%;
        line-height: 28px;
        margin-left: 5px;
        padding: 0 1rem;
        padding-left: 2.5rem;
        border: 2px solid transparent;
        border-radius: 8px;
        outline: none;
        background-color: #f3f3f4;
        color: #0d0c22;
        transition: .3s ease;
    }

    .search-input::placeholder {
        color: #9e9ea7;
    }

    .search-input:focus,
    .search-input:hover {
        outline: none;
        border-color: rgba(234, 76, 137, 0.4);
        background-color: #fff;
        box-shadow: 0 0 0 4px rgb(234 76 137 / 10%);
    }

    .icon {
        position: absolute;
        top: .5rem;
        left: 1rem;
        fill: #9e9ea7;
        width: 1rem;
        height: 1rem;
    }

    .chat-window {
        height: 85%;
        overflow-y: scroll;
    }

    .message-list {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .chat-input {
        display: flex;
        align-items: center;
        padding: 10px;
        border-top: 1px solid #ccc;
    }

    .message-input {
        flex: 1;
        border: none;
        outline: none;
        padding: 5px;
        font-size: 14px;
    }

    .send-button {
        border: none;
        outline: none;
        background-color: #333;
        color: #fff;
        font-size: 14px;
        padding: 5px 10px;
        cursor: pointer;
    }

    .send-button:hover {
        background-color: rgb(255, 255, 255);
        color: rgb(0, 0, 0);
        box-shadow: 0 4px 18px 0 rgba(0, 0, 0, 0.25);
    }

    /* From Uiverse.io by Li-Deheng */
    #btn-message {
        --text-color: #000;
        --bg-color-sup: #d2d2d2;
        --bg-color: #f4f4f4;
        --bg-hover-color: #ffffff;
        --online-status: #00da00;
        --font-size: 16px;
        --btn-transition: all 0.2s ease-out;
    }

    .button-message {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        font: 400 var(--font-size) Helvetica Neue, sans-serif;
        box-shadow: 0 0 2.17382px rgba(0, 0, 0, .049), 0 1.75px 6.01034px rgba(0, 0, 0, .07), 0 3.63px 14.4706px rgba(0, 0, 0, .091), 0 22px 48px rgba(0, 0, 0, .14);
        background-color: var(--bg-color);
        /* border-radius: 68px; */
        cursor: pointer;
        /* padding: 6px 10px 6px 6px; */
        padding: 8px 20px 8px 8px;
        /* width: fit-content; */
        width: 100%;
        height: 40px;
        border: 0;
        overflow: hidden;
        position: relative;
        transition: var(--btn-transition);
    }

    .button-message:hover {
        height: 56px;
        padding: 8px 20px 8px 8px;
        background-color: var(--bg-hover-color);
        transition: var(--btn-transition);
    }

    .button-message:active {
        transform: scale(0.99);
    }

    .content-avatar {
        width: 30px;
        height: 30px;
        margin: 0;
        transition: var(--btn-transition);
        position: relative;
    }

    .button-message:hover .content-avatar {
        width: 40px;
        height: 40px;
    }

    .avatar {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        overflow: hidden;
        background-color: var(--bg-color-sup);
    }

    .user-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .status-user {
        position: absolute;
        width: 6px;
        height: 6px;
        right: 1px;
        bottom: 1px;
        border-radius: 50%;
        outline: solid 2px var(--bg-color);
        background-color: var(--online-status);
        transition: var(--btn-transition);
        animation: active-status 2s ease-in-out infinite;
    }

    .button-message:hover .status-user {
        width: 10px;
        height: 10px;
        right: 1px;
        bottom: 1px;
        outline: solid 3px var(--bg-hover-color);
    }

    .notice-content {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        padding-left: 8px;
        text-align: initial;
        color: var(--text-color);
    }

    .username {
        letter-spacing: -6px;
        height: 0;
        opacity: 0;
        transform: translateY(-20px);
        transition: var(--btn-transition);
    }

    .user-id {
        font-size: 12px;
        letter-spacing: -6px;
        height: 0;
        opacity: 0;
        transform: translateY(10px);
        transition: var(--btn-transition);
    }

    .lable-message {
        display: flex;
        align-items: center;
        opacity: 1;
        transform: scaleY(1);
        transition: var(--btn-transition);
    }

    .button-message:hover .username {
        height: auto;
        letter-spacing: normal;
        opacity: 1;
        transform: translateY(0);
        transition: var(--btn-transition);
    }

    .button-message:hover .user-id {
        height: auto;
        letter-spacing: normal;
        opacity: 1;
        transform: translateY(0);
        transition: var(--btn-transition);
    }

    .button-message:hover .lable-message {
        height: 0;
        transform: scaleY(0);
        transition: var(--btn-transition);
    }

    .lable-message,
    .username {
        font-weight: 600;
    }

    .number-message {
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        margin-left: 8px;
        font-size: 12px;
        width: 16px;
        height: 16px;
        background-color: var(--bg-color-sup);
        border-radius: 20px;
    }

    /*==============================================*/
    @keyframes active-status {
        0% {
            background-color: var(--online-status);
        }

        33.33% {
            background-color: #93e200;
        }

        66.33% {
            background-color: #93e200;
        }

        100% {
            background-color: var(--online-status);
        }
    }
</style>
